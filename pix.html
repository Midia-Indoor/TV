<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- "only light": a pagina do QR nasce declarada como clara. Assim o
       navegador NAO aplica o "modo escuro automatico" aqui, e o QR
       fica preto no branco de verdade. -->
  <meta name="color-scheme" content="only light">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pagamento PIX</title>
  <style>
    html { color-scheme: only light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f6f6f4;
      color: #1c1b1a;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .pix-pagina { max-width: 420px; margin: 0 auto; padding: 24px 18px 40px; text-align: center; }
    .pix-titulo { font-size: 1.2rem; margin: 0 0 18px; }
    .pix-qr {
      background: #fff;
      color-scheme: only light;
      border: 1px solid #e4e4e1;
      border-radius: 14px;
      padding: 14px;
      margin: 0 0 14px;
    }
    .pix-qr img {
      display: block;
      width: 100%;
      max-width: 300px;
      height: auto;
      margin: 0 auto;
      image-rendering: pixelated;
      -ms-interpolation-mode: nearest-neighbor;
    }
    .pix-qr svg { display: block; width: 100%; max-width: 300px; height: auto; margin: 0 auto; }
    .pix-valor { font-size: 1rem; margin: 0 0 6px; }
    .pix-aviso {
      font-size: .85rem; color: #8a4b12; background: #fdf3e3; border: 1px solid #f0d9b5;
      border-radius: 10px; padding: 10px 12px; margin: 0 0 14px; line-height: 1.45; text-align: left;
    }
    .pix-dica { font-size: .85rem; color: #63605a; margin: 0 0 16px; line-height: 1.5; }
    .pix-rotulo { display: block; font-size: .8rem; font-weight: 700; color: #63605a; margin: 0 0 6px; text-align: left; }
    .pix-codigo {
      width: 100%; font: inherit; font-size: .82rem; padding: 10px; border: 1px solid #d3d3ce;
      border-radius: 9px; background: #fff; resize: vertical; word-break: break-all;
    }
    .btn {
      display: block; width: 100%; padding: 12px 16px; margin: 14px 0 0; font: inherit; font-weight: 700;
      border: 1px solid #d3d3ce; border-radius: 12px; background: transparent; color: #1c1b1a; cursor: pointer;
    }
    .btn:hover { background: #fafaf9; }
  </style>
</head>
<body>
  <main class="pix-pagina">
    <h1 class="pix-titulo" id="pixTitulo">Pagamento PIX</h1>
    <div id="pixQr"></div>
    <p class="pix-valor" id="pixValor"></p>
    <p class="pix-dica">Abra o aplicativo do seu banco, entre em PIX e aponte a câmera para o código.
      Se preferir, use o “copia e cola”.</p>
    <label class="pix-rotulo" for="pixCopiaECola">PIX copia e cola</label>
    <textarea id="pixCopiaECola" class="pix-codigo" readonly rows="3"></textarea>
    <button type="button" class="btn" id="pixCopiar">Copiar código PIX</button>
    <button type="button" class="btn" id="pixFechar">Fechar</button>
  </main>

  <script src="assets/js/qrcode.min.js?v=20261004"></script>
  <script>
    (function () {
      function escapar(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }
      function param(nome) {
        var m = new RegExp('[?&]' + nome + '=([^&]*)').exec(location.search);
        return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
      }

      /* Monta o QR como IMAGEM (raster): o "modo escuro automatico"
         recolore SVG, entao a imagem e a forma segura de manter preto
         no branco. */
      function montarQr(payload) {
        if (!payload || !window.qrcode) return '';
        try {
          var qr = window.qrcode(0, 'M');
          qr.addData(payload);
          qr.make();
          if (qr.createDataURL) {
            var n = qr.getModuleCount();
            var cell = Math.max(3, Math.floor(280 / (n + 8)));
            return '<img src="' + qr.createDataURL(cell, cell * 4) + '" alt="">';
          }
          return qr.createSvgTag({ cellSize: 6, margin: 2 });
        } catch (e) {
          return '';
        }
      }

      var payload = param('p');
      var valor = param('v');
      var nome = param('n') || 'Pagamento PIX';

      document.title = 'PIX — ' + nome;
      document.getElementById('pixTitulo').textContent = nome;
      if (valor) document.getElementById('pixValor').innerHTML = 'Valor: <strong>' + escapar(valor) + '</strong>';

      var campo = document.getElementById('pixCopiaECola');
      campo.value = payload;

      var qr = montarQr(payload);
      document.getElementById('pixQr').innerHTML = qr
        ? '<div class="pix-qr" role="img" aria-label="QR Code PIX">' + qr + '</div>'
        : '<p class="pix-aviso">Não foi possível desenhar o QR Code agora, mas o código abaixo funciona igual: ' +
          'abra o aplicativo do banco em PIX e use o “copia e cola”.</p>';

      document.getElementById('pixCopiar').addEventListener('click', function () {
        var botao = this;
        try {
          campo.focus();
          campo.select();
          var ok = document.execCommand && document.execCommand('copy');
          botao.textContent = ok ? 'Copiado! ✅' : 'Selecione o texto e copie (Ctrl+C)';
        } catch (e) {
          botao.textContent = 'Selecione o texto e copie (Ctrl+C)';
        }
      });

      document.getElementById('pixFechar').addEventListener('click', function () {
        try { window.close(); } catch (e) { /* alguns navegadores nao deixam */ }
      });
    })();
  </script>
</body>
</html>
