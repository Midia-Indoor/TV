<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8B1A1A">
  <title>Gerenciar Pedidos — Pastelaria do CAÊ</title>
  <meta name="description" content="Gerencie os pedidos da Pastelaria do CAÊ">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .gerenciar-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    .gerenciar-topo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .gerenciar-topo h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -.02em;
      flex: 1;
    }

    .filtros {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: end;
    }

    .filtros .campo {
      min-width: 200px;
    }

    .pedidos-lista {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pedido-card {
      background: var(--superficie);
      border: 1px solid var(--borda);
      border-radius: var(--raio);
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: start;
    }

    .pedido-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pedido-numero {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--primaria-texto);
    }

    .pedido-detalhes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
      font-size: .85rem;
    }

    .pedido-detalhes span {
      color: var(--texto-suave);
    }

    .pedido-detalhes strong {
      color: var(--texto);
      display: block;
    }

    .pedido-itens {
      margin-top: 8px;
      padding: 10px;
      background: var(--superficie-2);
      border-radius: var(--raio-sm);
      font-size: .85rem;
    }

    .pedido-itens ul {
      margin: 0;
      padding-left: 18px;
    }

    .pedido-acoes {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .status-aguardando {
      background: rgba(184, 134, 11, .15);
      color: #8a6407;
      border: 1px solid rgba(184, 134, 11, .35);
    }

    .status-preparando {
      background: rgba(232, 89, 12, .12);
      color: #c9480a;
      border: 1px solid rgba(232, 89, 12, .3);
    }

    .status-preparado {
      background: rgba(37, 211, 102, .12);
      color: #1eb955;
      border: 1px solid rgba(37, 211, 102, .3);
    }

    .status-saiu-entrega {
      background: rgba(139, 26, 26, .12);
      color: #8B1A1A;
      border: 1px solid rgba(139, 26, 26, .3);
    }

    .status-entregue {
      background: var(--sucesso-fundo);
      color: var(--sucesso-texto);
      border: 1px solid var(--sucesso-borda);
    }

    .status-select {
      min-width: 160px;
    }

    .pedido-vazio {
      text-align: center;
      padding: 60px 20px;
      color: var(--texto-suave);
    }

    .pedido-vazio-icone {
      font-size: 3rem;
      display: block;
      margin-bottom: 12px;
    }

    .atualizado-em {
      font-size: .8rem;
      color: var(--texto-tenue);
      text-align: right;
      margin-top: 16px;
    }

    @media (max-width: 640px) {
      .pedido-card {
        grid-template-columns: 1fr;
      }

      .pedido-acoes {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <header class="topo">
    <div class="container">
      <div class="topo-principal">
        <div class="marca">
          <div class="marca-logo" aria-hidden="true">📋</div>
          <div class="marca-texto">
            <h1 class="marca-nome">Gerenciar Pedidos</h1>
            <p class="marca-sub">Pastelaria do CAÊ</p>
          </div>
        </div>
        <a class="btn btn-contorno btn-sm" href="index.html">← Voltar ao cardápio</a>
        <a class="btn btn-contorno btn-sm" href="admin.html">Painel admin</a>
      </div>
    </div>
  </header>

  <main class="gerenciar-container">
    <div class="filtros">
      <div class="campo">
        <label for="filtroData">Filtrar por data</label>
        <input type="date" id="filtroData">
      </div>
      <div class="campo">
        <label for="filtroStatus">Filtrar por status</label>
        <select id="filtroStatus">
          <option value="">Todos os status</option>
          <option value="Novo">Novo</option>
          <option value="Aguardando">Aguardando</option>
          <option value="Preparando">Preparando</option>
          <option value="Preparado">Preparado</option>
          <option value="Saiu para entrega">Saiu para entrega</option>
          <option value="Entregue">Entregue</option>
          <option value="Cancelado">Cancelado</option>
        </select>
      </div>
      <button type="button" class="btn btn-contorno" id="btnLimparFiltros">Limpar filtros</button>
      <button type="button" class="btn btn-primario" id="btnAtualizar">🔄 Atualizar</button>
    </div>

    <div class="pedidos-lista" id="pedidosLista">
      <div class="pedido-vazio">
        <span class="pedido-vazio-icone">📋</span>
        <p>Carregando pedidos...</p>
      </div>
    </div>

    <p class="atualizado-em" id="atualizadoEm"></p>
  </main>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="assets/js/planilha-site.js"></script>
  <script src="assets/js/planilha.js"></script>
  <script>
    (function () {
      'use strict';

      var P = window.CardapioPlanilha;
      var el = {};
      var pedidos = [];
      var temporizador = null;

      var STATUS_VALIDOS = ['Novo', 'Aguardando', 'Preparando', 'Preparado', 'Saiu para entrega', 'Entregue', 'Cancelado'];

      function $(sel) { return document.querySelector(sel); }

      function esc(texto) {
        return String(texto == null ? '' : texto)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function moeda(valor) {
        return 'R$ ' + (Number(valor) || 0).toLocaleString('pt-BR', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
      }

      /* O Sheets devolve a data como Date em texto longo. Para exibir
         encurtamos; para filtrar comparamos dia a dia. Aceita
         dd/mm/aaaa, aaaa-mm-dd e o texto nativo do Sheets. */
      function paraData(texto) {
        var s = String(texto == null ? '' : texto).trim();
        if (!s) return null;
        var br = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s);
        if (br) return new Date(Number(br[3]), Number(br[2]) - 1, Number(br[1]));
        var iso = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
        if (iso) return new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));
        var d = new Date(s);
        return isNaN(d.getTime()) ? null : d;
      }

      function dataCurta(texto) {
        var d = paraData(texto);
        return d ? d.toLocaleDateString('pt-BR') : String(texto == null ? '' : texto);
      }

      function horaCurta(texto) {
        var s = String(texto == null ? '' : texto).trim();
        if (!s) return '';
        var hm = /(\d{1,2}):(\d{2})/.exec(s);
        if (hm) return ('0' + hm[1]).slice(-2) + ':' + hm[2];
        return s;
      }

      function classeStatus(status) {
        var s = String(status || '').toLowerCase();
        if (s.indexOf('aguard') >= 0) return 'status-aguardando';
        if (s.indexOf('prepar') >= 0 && s.indexOf('preparado') < 0) return 'status-preparando';
        if (s.indexOf('preparado') >= 0) return 'status-preparado';
        if (s.indexOf('saiu') >= 0 || s.indexOf('entrega') >= 0) return 'status-saiu-entrega';
        if (s.indexOf('entregue') >= 0 || s.indexOf('conclu') >= 0) return 'status-entregue';
        return 'status-aguardando';
      }

      function avisar(msg, tipo) {
        var anteriores = el.toasts.querySelectorAll('.toast');
        for (var i = 0; i < anteriores.length; i++) {
          if (anteriores[i].textContent === msg) return;
        }
        while (el.toasts.children.length >= 3) {
          el.toasts.firstElementChild.remove();
        }
        var t = document.createElement('div');
        t.className = 'toast' + (tipo ? ' toast-' + tipo : '');
        t.textContent = msg;
        el.toasts.appendChild(t);
        setTimeout(function () {
          t.style.transition = 'opacity .25s';
          t.style.opacity = '0';
          setTimeout(function () { t.remove(); }, 260);
        }, 2400);
      }

      /* Troca o conteudo da lista preservando a rolagem, para a tela
         nao "pular" para o topo a cada atualizacao. */
      function pintarLista(html) {
        var rolagem = window.scrollY;
        el.pedidosLista.innerHTML = html;
        if (rolagem) window.scrollTo(0, rolagem);
      }

      /* `silencioso` = atualizacao automatica: mantem a lista atual na
         tela em vez de mostrar "Buscando pedidos..." a cada 30 s. */
      function buscarPedidos(silencioso) {
        if (!P || !P.configurada()) {
          pintarLista('<div class="pedido-vazio"><span class="pedido-vazio-icone">⚠️</span><p>Planilha não configurada. Conecte o Google Sheets primeiro.</p></div>');
          return;
        }

        if (!silencioso) {
          pintarLista('<div class="pedido-vazio"><span class="pedido-vazio-icone">⏳</span><p>Buscando pedidos...</p></div>');
        }

        P.lerPedidos().then(function (resp) {
          if (!resp || resp.ok !== true) {
            pintarLista('<div class="pedido-vazio"><span class="pedido-vazio-icone">❌</span><p>' +
              esc((resp && resp.erro) || 'Não foi possível carregar os pedidos.') + '</p></div>');
            return;
          }
          pedidos = resp.pedidos || [];
          renderPedidos();
          el.atualizadoEm.textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR');
        }).catch(function (erro) {
          pintarLista('<div class="pedido-vazio"><span class="pedido-vazio-icone">❌</span><p>Erro ao buscar pedidos: ' + esc(erro && erro.message ? erro.message : erro) + '</p></div>');
        });
      }

      /* Atualizacao automatica: nao interrompe quem esta mexendo na
         lista (ex.: escolhendo um status) nem rouba o foco. */
      function atualizarAutomatico() {
        var ativo = document.activeElement;
        if (ativo && el.pedidosLista.contains(ativo)) return;
        buscarPedidos(true);
      }

      function renderPedidos() {
        var filtroData = el.filtroData.value;
        var filtroStatus = el.filtroStatus.value;

        var alvoData = filtroData ? new Date(filtroData + 'T00:00:00') : null;

        var filtrados = pedidos.filter(function (p) {
          if (alvoData) {
            var d = paraData(p.data);
            if (!d || d.getFullYear() !== alvoData.getFullYear() ||
                d.getMonth() !== alvoData.getMonth() ||
                d.getDate() !== alvoData.getDate()) return false;
          }
          if (filtroStatus && p.status !== filtroStatus) return false;
          return true;
        });

        if (!filtrados.length) {
          pintarLista('<div class="pedido-vazio"><span class="pedido-vazio-icone">📋</span><p>Nenhum pedido encontrado.</p></div>');
          return;
        }

        pintarLista(filtrados.map(function (p) {
          /* O script devolve "Itens do pedido" como texto
             ("1x X-Burguer (18.9) | ..."). Aceitamos também array,
             caso o script passe a mandar estruturado. */
          var itensLista = Array.isArray(p.itens)
            ? p.itens.map(function (i) {
                return i.quantidade + 'x ' + i.nome + ' — ' + moeda(i.quantidade * i.precoUnitario);
              })
            : String(p.itens || '').split(' | ').filter(Boolean);
          var itensHtml = itensLista.map(function (linha) {
            return '<li>' + esc(linha) + '</li>';
          }).join('');

          var opcoesStatus = STATUS_VALIDOS.map(function (s) {
            return '<option value="' + esc(s) + '"' + (p.status === s ? ' selected' : '') + '>' + esc(s) + '</option>';
          }).join('');

          return '' +
          '<div class="pedido-card" data-pedido="' + esc(p.pedido) + '">' +
            '<div class="pedido-info">' +
              '<div class="pedido-numero">Pedido #' + esc(p.pedido) + '</div>' +
              '<div class="pedido-detalhes">' +
                '<div><strong>Data</strong>' + esc(dataCurta(p.data)) + '</div>' +
                '<div><strong>Hora</strong>' + esc(horaCurta(p.hora)) + '</div>' +
                '<div><strong>Cliente</strong>' + esc(p.cliente) + '</div>' +
                '<div><strong>Tipo</strong>' + esc(p.tipo) + '</div>' +
                '<div><strong>Pagamento</strong>' + esc(p.pagamento) + '</div>' +
                '<div><strong>Total</strong>' + moeda(p.total) + '</div>' +
              '</div>' +
              (p.endereco ? '<div class="pedido-detalhes"><div><strong>Endereço</strong>' + esc(p.endereco) + '</div></div>' : '') +
              (p.bairro ? '<div class="pedido-detalhes"><div><strong>Bairro</strong>' + esc(p.bairro) + '</div></div>' : '') +
              (itensHtml ? '<div class="pedido-itens"><ul>' + itensHtml + '</ul></div>' : '') +
              (p.observacoes ? '<div class="pedido-detalhes"><div><strong>Observações</strong>' + esc(p.observacoes) + '</div></div>' : '') +
            '</div>' +
            '<div class="pedido-acoes">' +
              '<span class="status-badge ' + classeStatus(p.status) + '">' + esc(p.status) + '</span>' +
              '<select class="status-select" data-status-pedido="' + esc(p.pedido) + '">' +
                '<option value="">Alterar status...</option>' +
                opcoesStatus +
              '</select>' +
            '</div>' +
          '</div>';
        }).join(''));
      }

      function alterarStatus(pedido, novoStatus) {
        if (!P || !P.configurada()) {
          avisar('Planilha não configurada.', 'erro');
          return;
        }

        P.alterarStatusPedido(pedido, novoStatus).then(function () {
          avisar('Status do pedido #' + pedido + ' alterado para ' + novoStatus, 'ok');
          buscarPedidos(true);
        }).catch(function (erro) {
          avisar('Erro ao alterar status: ' + erro.message, 'erro');
        });
      }

      function ligarEventos() {
        el.filtroData.addEventListener('change', renderPedidos);
        el.filtroStatus.addEventListener('change', renderPedidos);

        el.btnLimparFiltros.addEventListener('click', function () {
          el.filtroData.value = '';
          el.filtroStatus.value = '';
          renderPedidos();
        });

        el.btnAtualizar.addEventListener('click', function () { buscarPedidos(); });

        el.pedidosLista.addEventListener('change', function (ev) {
          var select = ev.target.closest('[data-status-pedido]');
          if (!select) return;
          var pedido = select.getAttribute('data-status-pedido');
          var novoStatus = select.value;
          if (novoStatus) alterarStatus(pedido, novoStatus);
        });
      }

      function iniciar() {
        el = {
          filtroData: $('#filtroData'),
          filtroStatus: $('#filtroStatus'),
          btnLimparFiltros: $('#btnLimparFiltros'),
          btnAtualizar: $('#btnAtualizar'),
          pedidosLista: $('#pedidosLista'),
          atualizadoEm: $('#atualizadoEm'),
          toasts: $('#toasts')
        };

        ligarEventos();
        buscarPedidos();

        // Atualizar automaticamente a cada 30 segundos (sem interromper quem mexe na lista)
        temporizador = setInterval(atualizarAutomatico, 30000);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', iniciar);
      } else {
        iniciar();
      }
    })();
  </script>
</body>
</html>
