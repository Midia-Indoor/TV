<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#8B1A1A">
  <title>Cardápio Digital</title>
  <meta name="description" content="Cardápio digital — faça seu pedido e envie pelo WhatsApp.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>">
  <link rel="stylesheet" href="assets/css/style.css?v=20261004">
</head>
<body>

  <header class="topo">
    <div class="container">
      <div class="topo-principal">
        <div class="marca">
          <div class="marca-logo" id="marcaLogo" aria-hidden="true">🍔</div>
          <div class="marca-texto">
            <h1 class="marca-nome" id="marcaNome">Cardápio</h1>
            <p class="marca-sub" id="marcaSub"></p>
          </div>
          <span class=" selo" id="marcaStatus" hidden></span>
        </div>

        <div class="busca">
          <!-- <span class="busca-icone" aria-hidden="true">🔍</span> -->
          <label class="sr-only" for="campoBusca">Buscar no cardápio</label>
          <input type="search" id="campoBusca" placeholder="Buscar lanche…" autocomplete="off">
          <button type="button" class="busca-limpar" id="buscaLimpar" aria-label="Limpar busca" hidden>✕</button>
        </div>
      </div>

      <nav class="abas" id="abasCategorias" aria-label="Categorias do cardápio"></nav>
    </div>
  </header>

  <main class="container" id="conteudo">
    <div class="faixa-pedido oculto" id="faixaPedido">
      <span class="faixa-icone" aria-hidden="true">🛵</span>
      <a id="faixaPedidoLink" href="acompanhar.html">Acompanhar pedido <strong id="faixaPedidoNum"></strong></a>
      <button type="button" class="faixa-fechar" id="faixaPedidoFechar" aria-label="Ocultar acompanhamento">✕</button>
    </div>

    <div class="aviso-fechado" id="avisoFechado" hidden>
      <span aria-hidden="true">🌙</span>
      <div>
        <strong>Estamos fechados agora</strong>
        <span id="avisoFechadoTexto"></span>
      </div>
    </div>

    <div id="listaCategorias"></div>
  </main>

  <button type="button" class="carrinho-flutuante oculto" id="botaoCarrinho">
    <span class="cf-icone" aria-hidden="true">🛒</span>
    <span class="cf-info">
      <span id="cfTotal">R$ 0,00</span>
      <span class="cf-sub" id="cfSub">Seu pedido</span>
    </span>
    <span class="carrinho-badge" id="cfQtd">0</span>
  </button>

  <footer class="rodape">
    <div class="container">
      <p id="rodapeNome">Cardápio Digital</p>
      <p>Faça seu pedido e receba direto no WhatsApp. Sem cadastro, sem app.</p>
      <div class="rodape-links">
        <a href="admin.html">Área do dono</a>
        <a href="acompanhar.html">Acompanhar pedido</a>
        <a href="#" id="linkBaixarJson">Baixar cardápio (JSON)</a>
      </div>
    </div>
  </footer>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <div class="overlay oculto" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
    <div class="modal">
      <div class="modal-topo">
        <h2 class="modal-titulo" id="modalTitulo">Seu pedido</h2>
        <button type="button" class="fechar" id="modalFechar" aria-label="Fechar">✕</button>
      </div>
      <div class="modal-corpo" id="modalCorpo"></div>
      <div class="modal-rodape" id="modalRodape"></div>
    </div>
  </div>

  <!-- Preencha este arquivo com a URL da planilha: e ele que diz ao
       cliente de onde ler o cardapio. Sem ele, a pagina mostra so o
       exemplo embutido. -->
  <script src="assets/js/planilha-site.js?v=20261004"></script>
  <script src="assets/js/store.js?v=20261004"></script>
  <script src="assets/js/planilha.js?v=20261004"></script>
  <!-- QR Code (MIT, Kazuhiko Arase) embutido: nada de CDN, funciona
       offline e em file://. Usado para o QR do PIX no checkout. -->
  <script src="assets/js/qrcode.min.js?v=20261004"></script>
  <script src="assets/js/app.js?v=20261004"></script>
</body>
</html>
